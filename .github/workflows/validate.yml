name: Validate skills

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned validation dependencies
        run: npm ci --ignore-scripts

      - name: Discover skills in checkout
        run: npx --no-install skills add . --list

      - name: Test skill repository validator
        run: node --test test/validate-skills.test.mjs

      - name: Validate skill repository
        run: node scripts/validate-skills.mjs
